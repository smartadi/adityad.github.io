{% include base_path %}

<!-- start custom head snippets -->

<!-- Follow the visitor's OS light/dark preference unless they've chosen a
     theme here before. Runs before paint, so there's no flash of the wrong
     theme. assets/js/_main.js picks this attribute up on load. -->
<script>
  (function () {
    try {
      if (!localStorage.getItem("theme") &&
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) { /* private mode or blocked storage — fall back to light */ }
  })();
</script>
